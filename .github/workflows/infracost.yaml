name: "CI: Infracost FinOps Check"

on:
  push:
    branches: ["main"]
    paths:
      - 'infrastructure/terraform/aws-finops-mock/**'
  workflow_dispatch:

jobs:
  infracost_analysis:
    name: Cost Estimation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Run Infracost Analysis and Generate Summary
        run: |
          # 1. Print standard output to the logs for debugging
          echo "Running Infracost standard breakdown..."
          infracost breakdown --path=infrastructure/terraform/aws-finops-mock

          # 2. Generate a Markdown report and push it to GitHub Step Summary
          echo "Generating GitHub summary report..."
          infracost breakdown --path=infrastructure/terraform/aws-finops-mock \
                              --format=github-comment >> $GITHUB_STEP_SUMMARY
