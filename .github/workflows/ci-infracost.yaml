name: "CI / Infracost FinOps Check"

on:
  push:
    branches: ["main"]
    paths:
      - 'infrastructure/terraform/aws-finops-mock/**'
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  infracost_analysis:
    name: Infracost Estimation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Run Infracost Analysis and Generate Summary
        run: |
          echo "### FinOps: Infracost Breakdown" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          infracost breakdown --path=infrastructure/terraform/aws-finops-mock \
                              --format=table >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
