name: "CI: OPA Policy Validation"

on:
  push:
    branches: ["main"]
    paths:
      - 'policy/**'
      - 'infrastructure/**'
      - 'docker/**'
      - '!**.md'
      - '!docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-policies:
    name: Conftest Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Conftest & Helm
        run: |
          # Install Conftest
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.48.0/conftest_0.48.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.48.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

          # Install Helm (Required for K8s template rendering)
          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod 700 get_helm.sh
          ./get_helm.sh

      - name: 1. Validate Container Policies (Docker)
        run: |
          echo "Running Docker Policy Checks..."
          conftest test -p policy/docker_rules.rego docker/*/Dockerfile

      - name: 2. Validate Orchestration Policies (Kubernetes)
        run: |
          echo "Running K8s Policy Checks..."
          helm template sentinel infrastructure/helm/sentinel/ | conftest test -p policy/k8s_rules.rego -

      - name: 3. Validate Cloud Policies (AWS Terraform)
        run: |
          echo "Running AWS Policy Checks..."
          conftest test -p policy/aws_rules.rego infrastructure/terraform/aws-finops-mock/
