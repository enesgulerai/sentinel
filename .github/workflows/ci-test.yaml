name: "CI / Application Unit Tests"

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Go Tests
  test-api:
    name: Go Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: 'src/api/go.mod'
          cache: true

      - name: Run Go Tests with Race Detector
        run: go test -v -race ./...

  # Rust Tests
  test-validator:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/validator
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/validator"

      - name: Run Cargo Tests
        run: cargo test

  # Python Tests
  test-inference:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Pytest
        env:
          OTEL_SDK_DISABLED: "true"
        run: uv run pytest tests/unit/ -v
