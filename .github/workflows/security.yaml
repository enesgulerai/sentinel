name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Path Filtering: Detect which services changed to run jobs conditionally
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      validator: ${{ steps.filter.outputs.validator }}
      consumer: ${{ steps.filter.outputs.consumer }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'src/api/**'
            validator:
              - 'src/validator/**'
            consumer:
              - 'src/consumer/**'

  # Global Secret Scanning
  scan-secrets:
    name: Global Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Go SecOps
  scan-api-go:
    name: API (Go) Security Audit
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.api == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: 'src/api/go.mod'
          cache: true
          cache-dependency-path: 'src/api/go.sum'

      - name: Install Security Tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Gosec (SAST)
        run: gosec -exclude-dir=tests ./...

      - name: Run Govulncheck (Dependencies)
        run: govulncheck ./...

  # Rust SecOps
  scan-validator-rust:
    name: Validator (Rust) Security Audit
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.validator == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/validator
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv Environment
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python
        run: uv python pin 3.11


      - name: Run Bandit (SAST)
        run: uvx bandit -r src/inference

      - name: Run Pip Audit (Dependency Vulnerability Scan)
        run: uvx pip-audit --requirement pyproject.toml

  # Python SecOps
  scan-inference-python:
    name: Inference (Python) Security Audit
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.consumer == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv Environment
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python
        run: uv python pin 3.11

      - name: Install Security Tools
        run: uv pip install --system bandit pip-audit

      - name: Run Bandit (SAST)
        run: bandit -r src/inference

      - name: Run Pip Audit via uv (Dependency Vulnerability Scan)
        run: pip-audit --requirement pyproject.toml

  # Infrastructure Scan
  scan-infra:
    name: Infrastructure (Trivy) Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
