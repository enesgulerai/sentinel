name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Go Sast & Vulnerability Check
  security-go:
    name: Go Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: 'src/api/go.mod'
          cache: true
          cache-dependency-path: 'src/api/go.sum'

      - name: Install Security Tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Gosec (SAST)
        run: gosec ./...

      - name: Run Govulncheck (Dependency Audit)
        run: govulncheck ./...

  # Rust Linting & Security Check
  security-rust:
    name: Rust Security & Clippy Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/validator
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Dependency Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src/validator"

      - name: Run Cargo Clippy
        run: cargo clippy -- -D warnings

      - name: Run Cargo Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # Infrastructure & Filesystem Scan
  security-infra:
    name: Trivy Infrastructure Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
