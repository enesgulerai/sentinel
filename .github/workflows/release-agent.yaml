name: "CD: Release Agent"

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv Environment
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Run AI Release Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uv run --python 3.11 --with google-genai agent/release/release_agent.py

      - name: Update CHANGELOG.md
        run: |
          if [ -f "CHANGELOG.md" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "docs(changelog): append release notes for ${{ env.NEXT_TAG }} [skip ci]" || echo "No changes to commit"
            git push origin HEAD:${{ github.ref }}
          fi

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "release_notes.md" ]; then
            if [ -z "${{ env.NEXT_TAG }}" ]; then
              echo "Error: NEXT_TAG is empty! Make sure release_agent.py writes to GITHUB_ENV."
              exit 1
            fi

            echo "Publishing Release ${{ env.NEXT_TAG }}..."
            gh release create ${{ env.NEXT_TAG }} \
              --title "${{ env.NEXT_TAG }}" \
              --notes-file release_notes.md
          else
            echo "No release notes found. Skipping release creation."
          fi
