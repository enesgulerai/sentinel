name: "Nightly: Chaos Mesh Injection & Load Test"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-chaos-engineering:
    name: K6 Load Test with Chaos Injection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup KinD Cluster
        uses: helm/kind-action@v1.10.0
        with:
          node_image: kindest/node:v1.29.2

      - name: Install Chaos Mesh via Helm
        run: |
          echo "Adding Chaos Mesh Helm repository..."
          helm repo add chaos-mesh https://charts.chaos-mesh.org
          helm repo update

          echo "Installing Chaos Mesh onto the cluster..."
          helm install chaos-mesh chaos-mesh/chaos-mesh \
            --namespace=chaos-mesh \
            --create-namespace \
            --set chaosDaemon.runtime=containerd \
            --set chaosDaemon.socketPath=/run/containerd/containerd.sock \
            --version 2.6.2

          echo "Waiting for Chaos Mesh pods to be ready..."
          kubectl wait --for=condition=Ready pods --all -n chaos-mesh --timeout=300s

      - name: Install Metrics Server for HPA
        run: |
          echo "Installing Metrics Server..."
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

          echo "Patching Metrics Server for KinD (insecure-tls)..."
          kubectl patch -n kube-system deployment metrics-server --type=json \
            -p '[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}]'

          echo "Waiting for Metrics Server to be ready..."
          kubectl wait deployment -n kube-system metrics-server --for condition=Available=True --timeout=120s

      - name: Deploy Sentinel Infrastructure (Helm)
        run: |
          echo "Deploying Sentinel via Helm (bypassing strict HPA wait)..."
          helm upgrade --install sentinel infrastructure/helm/sentinel/ \
            --namespace sentinel-namespace \
            --create-namespace

          echo "Waiting for all pods to reach Ready state..."
          kubectl wait --for=condition=Ready pods --all -n sentinel-namespace --timeout=10m

      - name: Install k6 (Binary Download for CI Speed)
        run: |
          echo "Downloading k6 binary..."
          K6_VERSION="v0.52.0"
          wget -q https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz
          tar -xzf k6-${K6_VERSION}-linux-amd64.tar.gz
          sudo mv k6-${K6_VERSION}-linux-amd64/k6 /usr/local/bin/k6

      - name: Inject Chaos (Stress, Delay & Loss)
        run: |
          echo "Unleashing the Chaos Monkey..."
          kubectl apply -f tests/chaos/api-cpu-stress.yaml
          kubectl apply -f tests/chaos/api-network-delay.yaml
          kubectl apply -f tests/chaos/api-pod-kill.yaml
          kubectl apply -f tests/chaos/redis-network-loss.yaml

          echo "Giving Chaos Daemon 15 seconds to apply network and cgroup rules..."
          sleep 15

      - name: Run k6 Load Test Under Chaos
        run: |
          echo "List of available services for debugging:"
          kubectl get svc -n sentinel-namespace

          echo "Opening port-forward tunnel directly to the API deployment..."
          kubectl port-forward deploy/sentinel-api 8000:8000 -n sentinel-namespace > port-forward.log 2>&1 &

          echo "Waiting 5 seconds for tunnel to establish..."
          sleep 5

          echo "Port-forward logs:"
          cat port-forward.log

          echo "Starting k6 load test..."
          k6 run tests/fixtures/loadtest.js
