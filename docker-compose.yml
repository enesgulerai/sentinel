services:
  # Redpanda
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: sentinel-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sentinel_net

  # Console
  console:
    image: docker.redpanda.com/redpandadata/console:v2.4.5
    container_name: sentinel-console
    ports:
      - "8080:8080"
    entrypoint: /app/console
    environment:
      - KAFKA_BROKERS=redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - sentinel_net

  # Redis
  redis:
    image: valkey/valkey:8.0
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sentinel_net

  # API
  api:
    image: sentinel-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    pull_policy: missing
    container_name: sentinel-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDPANDA_BROKER=redpanda:9092
      - KAFKA_TOPIC=raw-events
      - PORT=8000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=sentinel
      - POSTGRES_PASSWORD=sentinel_password
      - POSTGRES_DB=sentinel_db
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - sentinel_net

  # Consumer
  consumer:
    image: sentinel-consumer:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/consumer/Dockerfile
    pull_policy: missing
    container_name: sentinel-consumer
    command: ["python", "-m", "src.inference.consumer"]
    environment:
      - REDPANDA_BROKER=redpanda:9092
      - KAFKA_TOPIC=clean-events
      - DATABASE_URL=postgresql://sentinel:sentinel_password@postgres:5432/sentinel_db
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - sentinel_net

  # Postgres
  postgres:
    image: pgvector/pgvector:pg15
    container_name: sentinel-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_password}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sentinel_net
    command:
      postgres
      -c shared_buffers=512MB
      -c work_mem=64MB
      -c maintenance_work_mem=256MB
      -c max_wal_size=2GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Validator
  validator:
    image: sentinel-validator:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/validator/Dockerfile
    pull_policy: missing
    container_name: sentinel-validator
    environment:
      - REDPANDA_BROKER=redpanda:9092
      - RUST_LOG=info
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - sentinel_net

volumes:
  postgres_data:

networks:
  sentinel_net:
    driver: bridge
