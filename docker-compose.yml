services:
  # --- Service: Redpanda ---
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: sentinel-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sentinel_net
    deploy:
      resources:
        reservations:
          cpus: '0.5'
          memory: 512M
        limits:
          cpus: '1.0'
          memory: 1.5G

  # --- Service: Console ---
  console:
    image: docker.redpanda.com/redpandadata/console:v2.4.5
    container_name: sentinel-console
    ports:
      - "8080:8080"
    entrypoint: /app/console
    environment:
      - KAFKA_BROKERS=redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - sentinel_net
    deploy:
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M

  # --- Service: Redis ---
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sentinel_net
    deploy:
      resources:
        reservations:
          memory: 16M
        limits:
          memory: 64M

  # --- Service: API ---
  api:
    image: sentinel-api:1.0.0
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: sentinel-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDPANDA_BROKER=redpanda:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4318
      - PORT=8000
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - sentinel_net
    deploy:
      resources:
        reservations:
          cpus: '0.1'
          memory: 32M
        limits:
          cpus: '0.5'
          memory: 128M

  # --- Service: Consumer ---
  consumer:
    image: sentinel-consumer:1.0.0
    build:
      context: .
      dockerfile: docker/consumer/Dockerfile
    container_name: sentinel-consumer
    command: ["python", "-m", "src.inference.consumer"]
    environment:
      - REDPANDA_BROKER=redpanda:9092
      - DATABASE_URL=postgresql://sentinel:sentinel_password@postgres:5432/sentinel_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - sentinel_net
    deploy:
      resources:
        reservations:
          cpus: '0.2'
          memory: 256M
        limits:
          cpus: '1.0'
          memory: 1G

  # --- Service: Postgres ---
  postgres:
    image: pgvector/pgvector:pg15
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_password
      POSTGRES_DB: sentinel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sentinel_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Service: Jaeger ---
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: sentinel-jaeger
    ports:
      - "16686:16686" # Jaeger Web UI (Traces can be visualized here)
      - "4317:4317"   # OTLP gRPC port (Go API will send traces here)
      - "4318:4318"   # OTLP HTTP port
    networks:
      - sentinel_net

volumes:
  postgres_data:

networks:
  sentinel_net:
    driver: bridge
