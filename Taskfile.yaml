version: '3'

dotenv: ['.env']

tasks:
  default:
    desc: Display this help menu listing all available commands
    silent: true
    cmds:
      - task --list

  # Environment Setup
  env:setup:
    desc: Install project dependencies and set up the development environment
    cmds:
      - uv sync
      - uv run pre-commit install

  # Docker Compose Operations
  docker:up:
    desc: Start all services using local 'dev' image tags
    env:
      IMAGE_TAG: 'dev'
    cmds:
      - docker compose up -d --build

  docker:down:
    desc: Stop and remove Docker containers, networks, and volumes
    cmds:
      - docker compose down

  docker:clean:
    desc: Forcefully remove all unused and dangling images
    cmds:
      - docker image prune -a -f

  docker:nuke:
    desc: Sequentially stop containers and clear all unused images
    cmds:
      - task: docker:down
      - task: docker:clean

  docker:ps:
    desc: Show the current status of running containers
    cmds:
      - docker compose ps

  # Kubernetes & Helm Operations
  _setup-ingress:
    internal: true
    cmds:
      - kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/cloud/deploy.yaml
      - cmd: powershell -Command "Start-Sleep -Seconds 5"
        platforms: [windows]
      - cmd: sleep 5
        platforms: [linux, darwin]
      - kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=120s
      - docker pull valkey/valkey:8.0

  helm:dev:
    desc: Deploy Sentinel using LOCAL images (Inner Loop) for development
    deps: [_setup-ingress]
    cmds:
      - helm upgrade --install sentinel ./infrastructure/helm/sentinel -n sentinel-namespace --create-namespace

  helm:prod:
    desc: Deploy Sentinel infrastructure using PROD images (Git SHA) from GHCR
    deps: [_setup-ingress]
    cmds:
      - helm upgrade --install sentinel-prod ./infrastructure/helm/sentinel -f ./infrastructure/helm/sentinel/values.production.yaml -n sentinel-namespace --create-namespace

  helm:status:
    desc: Watch the real-time status of the Sentinel Helm deployment
    cmds:
      - kubectl get pods -n sentinel-namespace -w

  helm:monitor:
    desc: Deploy the official Prometheus & Grafana stack for observability
    cmds:
      - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      - helm repo update
      - helm upgrade --install observability prometheus-community/kube-prometheus-stack -n monitoring --create-namespace --wait

  helm:forward:
    desc: Bind K8s isolated network to localhost via Ingress (API port 8000)
    cmds:
      - kubectl port-forward svc/ingress-nginx-controller 8000:80 -n ingress-nginx

  helm:down:
    desc: Uninstall the Sentinel Helm releases and clean up resources
    cmds:
      - cmd: helm uninstall sentinel -n sentinel-namespace
        ignore_error: true
      - cmd: helm uninstall sentinel-prod -n sentinel-namespace
        ignore_error: true

  # MLOps & Data Pipeline
  ml:pipeline:
    desc: Run the complete end-to-end machine learning pipeline
    deps: [ml:train]
    silent: true
    cmds:
      - echo "Full Machine Learning Pipeline Completed successfully."

  ml:fetch:
    desc: Download raw data and verify integrity using SHA-256
    cmds:
      - uv run python -m src.data.ingestion

  ml:preprocess:
    desc: Split train/test sets and apply preprocessing without data leakage
    deps: [ml:fetch]
    cmds:
      - uv run python -m src.features.preprocessing

  ml:train:
    desc: Train the champion model (XGBoost) and export it to ONNX format
    deps: [ml:preprocess]
    cmds:
      - uv run python -m src.models.trainer

  ml:clean:
    desc: Wipe all generated datasets, scaled files, and trained models
    ignore_error: true
    cmds:
      - rm -f data/raw/creditcard.csv
      - rm -f data/processed/*.csv
      - rm -f models/*.joblib
      - rm -f models/*.onnx

  # Testing Suites
  test:all:
    desc: Run all test suites sequentially (API, Validator, Consumer)
    cmds:
      - task: test:api
      - task: test:validator
      - task: test:consumer

  test:api:
    desc: Run Go API unit and integration tests
    dir: src/api
    cmds:
      - go test -v .

  test:consumer:
    desc: Run Python ML Consumer unit tests with Pytest
    env:
      OTEL_SDK_DISABLED: "true"
    cmds:
      - pytest tests/unit/test_consumer.py -v

  test:validator:
    desc: Run Rust Validator unit tests via Cargo
    dir: src/validator/src
    cmds:
      - cargo test

  # Autonomous Agents
  agent:doc:
    desc: Run the autonomous Engineering Council to generate the architectural report
    cmds:
      - uv run agent/doc/doc_agent.py

  agent:release:
    desc: Execute the AI Release Agent for automated SemVer bumps and changelog generation
    cmds:
      - uv run agent/release/release_agent.py
