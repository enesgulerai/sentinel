apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-api
  labels:
    app: sentinel-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentinel-api
  template:
    metadata:
      labels:
        app: sentinel-api
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo "Waiting for Postgres to become ready..."; sleep 2; done;']
      - name: wait-for-redis
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z redis 6379; do echo "Waiting for Redis to become ready..."; sleep 2; done;']
      - name: wait-for-redpanda
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z redpanda 9092; do echo "Waiting for Redpanda to become ready..."; sleep 2; done;']
      containers:
      - name: api
        image: ghcr.io/enesgulerdev/sentinel-api:9e4cd78
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: postgres-secret
        env:
        - name: PORT
          value: "8000"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDPANDA_BROKER
          value: "redpanda:9092"
        - name: KAFKA_TOPIC
          value: "transactions"
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_PORT
          value: "5432"
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "800m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-api-service
spec:
  type: LoadBalancer
  selector:
    app: sentinel-api
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
