apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-consumer
  template:
    metadata:
      labels:
        app: sentinel-consumer
    spec:
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "ai-inference"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: role
                operator: In
                values:
                - ai-inference
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo "Waiting for Postgres to become ready..."; sleep 2; done;']
      - name: wait-for-redpanda
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z redpanda 9092; do echo "Waiting for Redpanda to become ready..."; sleep 2; done;']
      containers:
      - name: consumer
        image: ghcr.io/enesgulerdev/sentinel-consumer:9e4cd78
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "src.inference.consumer"]
        envFrom:
        - secretRef:
            name: postgres-secret
        env:
        - name: REDPANDA_BROKER
          value: "redpanda:9092"
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
        resources:
          requests:
            cpu: "200m"
            memory: "128Mi"
          limits:
            cpu: "1"
            memory: "256Mi"
