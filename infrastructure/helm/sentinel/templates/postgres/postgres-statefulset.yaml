{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg15
        args:
        - "-c"
        - "shared_buffers=512MB"
        - "-c"
        - "work_mem=64MB"
        - "-c"
        - "maintenance_work_mem=256MB"
        - "-c"
        - "max_wal_size=2GB"
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: postgres-secret

        {{- if .Values.postgres.resources }}
        resources:
          {{- toYaml .Values.postgres.resources | nindent 10 }}
        {{- end }}

        {{- if .Values.postgres.startupProbe }}
        startupProbe:
          {{- toYaml .Values.postgres.startupProbe | nindent 10 }}
        {{- end }}

        {{- if .Values.postgres.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.postgres.livenessProbe | nindent 10 }}
        {{- end }}

        {{- if .Values.postgres.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.postgres.readinessProbe | nindent 10 }}
        {{- end }}

        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
      volumes:
      - name: init-script
        configMap:
          name: postgres-init-script
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
{{- end }}
