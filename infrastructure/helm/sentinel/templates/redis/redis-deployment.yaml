{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-redis
  labels:
    app: redis
    env: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        environment: {{ .Values.global.labels.environment | quote }}
        owner: {{ .Values.global.labels.owner | quote }}
        project: {{ .Values.global.labels.project | quote }}
    spec:
      containers:
      - name: redis
        image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
        ports:
        - containerPort: 6379
        resources:
          {{- toYaml .Values.redis.resources | nindent 10 }}

        {{- if .Values.redis.startupProbe }}
        startupProbe:
          {{- toYaml .Values.redis.startupProbe | nindent 10 }}
        {{- end }}

        {{- if .Values.redis.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.redis.livenessProbe | nindent 10 }}
        {{- end }}

        {{- if .Values.redis.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.redis.readinessProbe | nindent 10 }}
        {{- end }}
{{- end }}
