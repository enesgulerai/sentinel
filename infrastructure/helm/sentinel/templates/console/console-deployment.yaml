{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-console
  labels:
    app: console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      initContainers:
      - name: wait-for-redpanda
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z redpanda 9092; do echo "Waiting for Redpanda to become ready..."; sleep 2; done;']

      containers:
      - name: console
        image: docker.redpanda.com/redpandadata/console:v2.4.5
        env:
        - name: KAFKA_BROKERS
          value: "redpanda:9092"
        ports:
        - containerPort: 8080

        {{- if .Values.console.resources }}
        resources:
          {{- toYaml .Values.console.resources | nindent 10 }}
        {{- end }}

        {{- if .Values.console.startupProbe }}
        startupProbe:
          {{- toYaml .Values.console.startupProbe | nindent 10 }}
        {{- end }}

        {{- if .Values.console.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.console.livenessProbe | nindent 10 }}
        {{- end }}

        {{- if .Values.console.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.console.readinessProbe | nindent 10 }}
        {{- end }}
{{- end }}
