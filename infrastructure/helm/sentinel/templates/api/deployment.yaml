{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-api
  labels:
    app: sentinel-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: sentinel-api
  template:
    metadata:
      labels:
        app: sentinel-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo "Waiting for Postgres..."; sleep 2; done;']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379; do echo "Waiting for Redis..."; sleep 2; done;']
        - name: wait-for-redpanda
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redpanda 9092; do echo "Waiting for Redpanda..."; sleep 2; done;']

      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.service.port }}

          # Mevcut Secret'ı kullanmaya devam ediyoruz
          envFrom:
            - secretRef:
                name: postgres-secret

          env:
            - name: PORT
              value: "{{ .Values.api.service.port }}"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDPANDA_BROKER
              value: "redpanda:9092"
            - name: KAFKA_TOPIC
              value: "transactions"
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: "5432"

          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 2
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
{{- end }}
