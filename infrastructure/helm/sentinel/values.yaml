# Sentinel Global Helm Chart Values
global:
  labels:
    environment: "production"
    owner: "sentinel-team"
    project: "sentinel"

  imagePullPolicy: IfNotPresent

# Go Gateway Helm Chart Values
api:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/enesgulerdev/sentinel-api
    tag: "58ede6b"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 8000
  env:
    - name: REDPANDA_BROKER
      value: "redpanda:9092"
    - name: REDIS_HOST
      value: "redis"
    - name: REDIS_URL
      value: "redis:6379"
    - name: POSTGRES_HOST
      value: "postgres"
    - name: POSTGRES_PORT
      value: "5432"
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
#    limits:
#      cpu: "500m"
#      memory: "128Mi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
    targetMemoryAverageValue: "100Mi"
  ingress:
    enabled: true
    className: "nginx"
    hosts:
      - host: "api.sentinel.local"
        paths:
          - path: "/"
            pathType: Prefix
  startupProbe:
    httpGet:
      path: /health/startup
      port: 8000
    failureThreshold: 30
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /health/live
      port: 8000
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8000
    periodSeconds: 10

# Rust Validator Helm Chart Values
validator:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/enesgulerdev/sentinel-validator
    tag: "58ede6b"
    pullPolicy: IfNotPresent
  env:
    - name: REDPANDA_BROKER
      value: "redpanda:9092"
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
#    limits:
#      cpu: "100m"
#      memory: "64Mi"
  startupProbe:
    exec:
      command:
        - /app/sentinel-validator
        - --check-startup
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 10
    timeoutSeconds: 10
  livenessProbe:
    exec:
      command:
        - /app/sentinel-validator
        - --check-live
    initialDelaySeconds: 5
    periodSeconds: 20
    failureThreshold: 3
    timeoutSeconds: 3
  readinessProbe:
    exec:
      command:
        - /app/sentinel-validator
        - --check-ready
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 3

# Python Consumer Helm Chart Values
consumer:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/enesgulerdev/sentinel-consumer
    tag: "58ede6b"
    pullPolicy: IfNotPresent
  env:
    - name: REDPANDA_BROKER
      value: "redpanda:9092"
    - name: DATABASE_URL
      value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
#    limits:
#      cpu: "400m"
#      memory: "256Mi"
  startupProbe:
    exec:
      command:
        - python
        - -c
        - "import sys; sys.exit(0)"
    failureThreshold: 15
    periodSeconds: 10
  livenessProbe:
    exec:
      command:
        - python
        - -c
        - "import sys; sys.exit(0)"
    periodSeconds: 20
  readinessProbe:
    exec:
      command:
        - python
        - -c
        - "import sys; sys.exit(0)"
    periodSeconds: 10

# PostgreSQL Helm Chart Values
postgres:
  enabled: true
  auth:
    user: "sentinel_user"
    password: "secure_password"
    database: "sentinel_db"
  resources:
    requests:
      cpu: "20m"
      memory: "64Mi"
#    limits:
#      cpu: "500m"
#      memory: "256Mi"

# Redis Helm Chart Values
redis:
  enabled: true
  image:
    repository: valkey/valkey
    tag: "8.0"
  resources:
    requests:
      cpu: "32m"
      memory: "10Mi"
#    limits:
#      cpu: "128m"
#      memory: "800Mi"

# Redpanda Helm Chart Values
redpanda:
  enabled: true
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
#    limits:
#      cpu: "1000m"
#      memory: "512Mi"
