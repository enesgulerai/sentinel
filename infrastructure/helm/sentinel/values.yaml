# ==========================================
# SENTINEL GLOBAL CONFIGURATION
# ==========================================
global:
  environment: production
  imagePullPolicy: IfNotPresent

# ==========================================
# 1. GO API GATEWAY
# ==========================================
api:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/enesgulerdev/sentinel-api
    tag: 13e1ae8
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 8000
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "800m"
      memory: "256Mi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
    targetMemoryAverageValue: "80Mi"

# ==========================================
# 2. RUST VALIDATOR
# ==========================================
validator:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/enesgulerdev/sentinel-validator
    tag: 13e1ae8
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ==========================================
# 3. PYTHON ML CONSUMER
# ==========================================
consumer:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/enesgulerdev/sentinel-consumer
    tag: 13e1ae8
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "200m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "256Mi"


# ==========================================
# CUSTOM INFRASTRUCTURE COMPONENTS
# ==========================================
postgres:
  enabled: true
redis:
  enabled: true
redpanda:
  enabled: true
console:
  enabled: true
