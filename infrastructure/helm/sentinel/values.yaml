# ==========================================
# SENTINEL GLOBAL CONFIGURATION
# ==========================================
global:
  environment: production
  imagePullPolicy: IfNotPresent

# ==========================================
# 1. GO API GATEWAY
# ==========================================
api:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/enesgulerdev/sentinel-api
    tag: 7b765ae
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 8000
  env:
    - name: REDPANDA_BROKER
      value: "redpanda:9092"
    - name: REDIS_HOST
      value: "redis"
    - name: REDIS_URL
      value: "redis:6379"
    - name: POSTGRES_HOST
      value: "postgres"
    - name: POSTGRES_PORT
      value: "5432"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://jaeger:4318/v1/traces"
  resources:
    requests:
      cpu: "200m"
      memory: "64Mi"
    limits:
      cpu: "1200m"
      memory: "256Mi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
    targetMemoryAverageValue: "80Mi"

# ==========================================
# 2. RUST VALIDATOR
# ==========================================
validator:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/enesgulerdev/sentinel-validator
    tag: 7b765ae
    pullPolicy: IfNotPresent
  env:
    - name: REDPANDA_BROKER
      value: "redpanda:9092"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://jaeger:4318/v1/traces"
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ==========================================
# 3. PYTHON ML CONSUMER
# ==========================================
consumer:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/enesgulerdev/sentinel-consumer
    tag: 7b765ae
    pullPolicy: IfNotPresent
  env:
    - name: REDPANDA_BROKER
      value: "redpanda:9092"
    - name: DATABASE_URL
      value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
  resources:
    requests:
      cpu: "200m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "256Mi"

# ==========================================
# CUSTOM INFRASTRUCTURE COMPONENTS
# ==========================================
postgres:
  enabled: true
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

redis:
  enabled: true
  image:
    repository: docker.dragonflydb.io/dragonflydb/dragonfly
    tag: "latest"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

redpanda:
  enabled: true
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1500m"
      memory: "1024Mi"

console:
  enabled: true
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
