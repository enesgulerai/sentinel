# Sentinel Global Helm Chart Values
global:
  environment: production
  imagePullPolicy: IfNotPresent

# Go Gateway Helm Chart Values
api:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/enesgulerdev/sentinel-api
    tag: "a3bc6a7"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 8000
  env:
    - name: REDPANDA_BROKER
      value: "redpanda:9092"
    - name: REDIS_HOST
      value: "redis"
    - name: REDIS_URL
      value: "redis:6379"
    - name: POSTGRES_HOST
      value: "postgres"
    - name: POSTGRES_PORT
      value: "5432"
  resources:
    requests:
      cpu: "500m"
      memory: "128Mi"
    limits:
      cpu: "2000m"
      memory: "256Mi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
    targetMemoryAverageValue: "100Mi"
  ingress:
    enabled: true
    className: "nginx"
    hosts:
      - host: "api.sentinel.local"
        paths:
          - path: "/"
            pathType: Prefix
  startupProbe:
    httpGet:
      path: /health/startup
      port: 8000
    failureThreshold: 30
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /health/live
      port: 8000
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8000
    periodSeconds: 10

# Rust Validator Helm Chart Values
validator:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/enesgulerdev/sentinel-validator
    tag: "a3bc6a7"
    pullPolicy: IfNotPresent
  env:
    - name: REDPANDA_BROKER
      value: "redpanda:9092"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  startupProbe:
    exec:
      command:
        - /bin/sh
        - -c
        - /app/validator --check-startup
    failureThreshold: 6
    periodSeconds: 5
  livenessProbe:
    exec:
      command:
        - /bin/sh
        - -c
        - /app/validator --check-live
    periodSeconds: 20
  readinessProbe:
    exec:
      command:
        - /bin/sh
        - -c
        - /app/validator --check-ready
    periodSeconds: 10

# Python Consumer Helm Chart Values
consumer:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/enesgulerdev/sentinel-consumer
    tag: "a3bc6a7"
    pullPolicy: IfNotPresent
  env:
    - name: REDPANDA_BROKER
      value: "redpanda:9092"
    - name: DATABASE_URL
      value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
  resources:
    requests:
      cpu: "1000m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "256Mi"
  startupProbe:
    exec:
      command:
        - python
        - -c
        - "import sys; sys.exit(0)"
    failureThreshold: 15
    periodSeconds: 10
  livenessProbe:
    exec:
      command:
        - python
        - -c
        - "import sys; sys.exit(0)"
    periodSeconds: 20
  readinessProbe:
    exec:
      command:
        - python
        - -c
        - "import sys; sys.exit(0)"
    periodSeconds: 10

# PostgreSQL Helm Chart Values
postgres:
  enabled: true
  auth:
    user: "sentinel_user"
    password: "secure_password"
    database: "sentinel_db"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

# Redis Helm Chart Values
redis:
  enabled: true
  image:
    repository: docker.dragonflydb.io/dragonflydb/dragonfly
    tag: "v1.17.1"
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# Redpanda Helm Chart Values
redpanda:
  enabled: true
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

console:
  enabled: true
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"
  startupProbe:
    httpGet:
      path: /admin/health
      port: 8080
    failureThreshold: 20
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /admin/health
      port: 8080
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /admin/health
      port: 8080
    periodSeconds: 10
