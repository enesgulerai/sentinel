apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: api-cpu-stress
  namespace: sentinel-namespace
spec:
  mode: all
  selector:
    namespaces:
      - sentinel-namespace
    labelSelectors:
      app: sentinel-api
  stressors:
    cpu:
      workers: 2
      load: 100
  duration: "30s"
