apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: redis-network-loss
  namespace: sentinel-namespace
spec:
  action: loss
  mode: all
  selector:
    namespaces:
      - sentinel-namespace
    labelSelectors:
      app: sentinel-redis
  loss:
    loss: "100"
    correlation: "0"
  direction: to
  duration: "30s"
