apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: api-network-delay
  namespace: sentinel-namespace
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - sentinel-namespace
    labelSelectors:
      app: sentinel-api
  delay:
    latency: "2000ms"
    correlation: "100"
    jitter: "0ms"
