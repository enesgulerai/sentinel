repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: '^infrastructure/helm/.*'
      - id: check-toml
      - id: debug-statements
      - id: check-added-large-files
        args: ['--maxkb=5120']

  # Conventional Commits Linter
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # YAML Linter
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        exclude: '^infrastructure/helm/.*'

  # Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  # Go
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-vet

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint
        args: [--timeout=5m, --path-prefix=src/api]

  # Rust
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
      - id: clippy

  # Infrastructure & FinOps Security (Checkov)
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.1.52
    hooks:
      - id: checkov
        args: ["-d", "infrastructure/terraform/aws-finops-mock/", "--soft-fail"]

  # Temporarily disabled due to Windows AppLocker (WinError 4551).
  # Uncomment this if you move development to WSL or Linux.
  # - repo: https://github.com/gitleaks/gitleaks
