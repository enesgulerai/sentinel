version: '3'

tasks:
  default:
    desc: Displays this help menu listing all available commands
    silent: true
    cmds:
      - task --list

  # ==========================================
  # CODE QUALITY & LINTING
  # ==========================================
  lint-fix:
    desc: Run Ruff linter and automatically fix fixable issues
    cmds:
      - uv run ruff check --fix .

  format:
    desc: Run Ruff formatter to auto-format Python code
    cmds:
      - uv run ruff format .

  check:
    desc: Run local workflow (Fix lint issues, format, and check types)
    cmds:
      - task: lint-fix
      - task: format

  ci-check:
    desc: Run all checks strictly for CI
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  # ==========================================
  # ENVIRONMENT
  # ==========================================
  install:
    desc: Installs project dependencies and sets up the development environment
    cmds:
      - uv sync
      - uv run pre-commit install

  # ==========================================
  # MLOPS & DATA PIPELINE
  # ==========================================
  fetch:
    desc: Downloads raw data and verifies integrity using SHA-256
    cmds:
      - uv run python -m src.data.ingestion

  preprocess:
    desc: Splits train/test sets and applies preprocessing without data leakage
    deps: [fetch]
    cmds:
      - uv run python -m src.features.preprocessing

  train:
    desc: Trains the champion model (XGBoost) and exports it to ONNX format
    deps: [preprocess]
    cmds:
      - uv run python -m src.models.trainer

  pipeline:
    desc: Runs the complete end-to-end machine learning pipeline
    deps: [train]
    silent: true
    cmds:
      - 'echo "SUCCESS: Full Machine Learning Pipeline Completed!"'

  clean:
    desc: Wipes all generated datasets, scaled files, and trained models
    silent: true
    ignore_error: true
    cmds:
      - rm -f data/raw/creditcard.csv
      - rm -f data/processed/*.csv
      - rm -f models/*.joblib
      - rm -f models/*.onnx
      - echo "All generated data and models have been wiped clean."

  # ==========================================
  # TESTS
  # ==========================================
  test:
    desc: Run all tests in the tests directory
    cmds:
      - pytest tests/

  load-test-health:
    desc: Run OHA load test for 1 minute with 250 concurrent workers on health endpoint
    cmds:
      - oha -c 250 -z 1m http://localhost:8000/
  # ==========================================
  # INFRASTRUCTURE & DOCKER
  # ==========================================
  up:
    desc: Docker - Builds images and starts infrastructure containers in the background
    cmds:
      - docker compose up --build -d

  down:
    desc: "Stops and removes Docker containers, networks, and volumes"
    cmds:
      - docker compose down

  ps:
    desc: Docker - Shows the current status of running containers
    cmds:
      - docker compose ps

  # ==========================================
  # KUBERNETES
  # ==========================================
  k8s:build-load:
    desc: Build local images and load them into the Kind cluster
    cmds:
      - docker build -f docker/backend/Dockerfile -t sentinel-api:v0.5.0 .
      - docker build -f docker/frontend/Dockerfile -t sentinel-ui:v0.5.0 .
      - docker build -f docker/backend/Dockerfile -t sentinel-consumer:v0.5.0 .
      - kind load docker-image sentinel-api:v0.5.0 --name kind
      - kind load docker-image sentinel-ui:v0.5.0 --name kind
      - kind load docker-image sentinel-consumer:v0.5.0 --name kind

  k8s:up:
    desc: Deploy the complete Sentinel stack to Kubernetes
    cmds:
      - kubectl apply -f k8s/infrastructure/
      - kubectl apply -f k8s/apps/

  k8s:status:
    desc: Check the current status of all Kubernetes pods
    cmd: kubectl get pods

  k8s:down:
    desc: Remove the Sentinel stack from Kubernetes
    cmds:
      - kubectl delete -f k8s/apps/ --ignore-not-found
      - kubectl delete -f k8s/infrastructure/ --ignore-not-found

  k8s:forward:
    desc: Forward all necessary K8s ports in a single terminal
    deps:
      - task: _forward-api
      - task: _forward-ui
      - task: _forward-console

  _forward-api:
    internal: true
    cmd: kubectl port-forward svc/api 8000:8000

  _forward-ui:
    internal: true
    cmd: kubectl port-forward svc/ui 8501:8501

  _forward-console:
    internal: true
    cmd: kubectl port-forward svc/console 8080:8080
