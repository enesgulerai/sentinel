version: '3'

tasks:
  default:
    desc: Displays this help menu listing all available commands
    silent: true
    cmds:
      - task --list

  # ==========================================
  # DOCKER
  # ==========================================

  # ON - OFF
  docker:on:
    desc: "Docker - Start all services using the current Git SHA image tags"
    vars:
      GIT_SHA:
        sh: git rev-parse --short HEAD
    env:
      IMAGE_TAG: '{{.GIT_SHA}}'
    cmds:
      - echo "Starting all services with IMAGE_TAG={{.GIT_SHA}}"
      - docker compose up -d


  docker:off:
    desc: "Docker - Sequentially stops containers and clears all unused images"
    cmds:
      - task: docker:down
      - task: docker:clear
      - cmd: echo "Docker environment has been completely shut down and cleaned."
        silent: true

  # OFF TASKS
  docker:down:
    desc: "Docker - Stops and removes Docker containers, networks, and volumes"
    cmds:
      - docker compose down

  docker:clear:
    desc: Docker - Forcefully removes all unused and dangling images to free up space
    cmds:
      - docker image prune -a -f

  # STATUS TASKS
  docker:ps:
    desc: Docker - Shows the current status of running containers
    cmds:
      - docker compose ps

  # ==========================================
  # HELM
  # ==========================================
  helm:on:
    desc: "Helm - Build the local ML image and deploy the Sentinel infrastructure autonomously"
    cmds:
      - kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/cloud/deploy.yaml
      - echo "Waiting for Ingress Controller to become ready..."
      - sleep 5
      - kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=120s
      - echo "Pre-pulling Dragonfly image to prevent network timeouts and ImagePullBackOff..."
      - docker pull docker.dragonflydb.io/dragonflydb/dragonfly:latest
      - echo "Deploying Sentinel infrastructure via Helm..."
      - helm upgrade --install sentinel-prod ./infrastructure/helm/sentinel -n sentinel-namespace --create-namespace

  helm:status:
    desc: Helm - Watch the real-time status of the Sentinel Helm deployment
    cmds:
      - kubectl get pods -n sentinel-namespace -w

  helm:forward:
    desc: "Helm - Bind K8s isolated network to localhost via Ingress (API: 8000, Console: 8080)"
    cmds:
      - |
        echo "Starting Ingress port-forwarding... Press Ctrl+C to stop all connections."
        kubectl port-forward svc/ingress-nginx-controller 8000:80 -n ingress-nginx &
        kubectl port-forward svc/console 8080:8080 -n sentinel-namespace &
        wait

  helm:off:
    desc: Helm - Uninstall the Sentinel Helm release and clean up resources
    cmds:
      - helm uninstall sentinel-prod -n sentinel-namespace

  # ==========================================
  # CODE QUALITY & LINTING
  # ==========================================

  # ON
  qa:on:
    desc: "QA - Run local workflow (Fix lint issues, format, and check types)"
    cmds:
      - task: qa:lint-fix
      - task: qa:format
      - task: qa:type-check

  # LINT - FORMAT - TYPE TASKS
  qa:lint-fix:
    desc: "QA - Run Ruff linter and automatically fix fixable issues"
    cmds:
      - uv run ruff check --fix .

  qa:format:
    desc: "QA - Run Ruff formatter to auto-format Python code"
    cmds:
      - uv run ruff format .

  qa:type-check:
    desc: "QA - Run static type checker while ignoring third-party missing stubs"
    cmds:
      - uv run mypy src --explicit-package-bases --ignore-missing-imports

  # ==========================================
  # ENVIRONMENT
  # ==========================================
  env:install:
    desc: ENV - Installs project dependencies and sets up the development environment
    cmds:
      - uv sync
      - uv run pre-commit install

  # ==========================================
  # MLOPS & DATA PIPELINE
  # ==========================================

  ml:pipeline:
    desc: ML - Runs the complete end-to-end machine learning pipeline
    deps: [ml:train]
    silent: true
    cmds:
      - 'echo "SUCCESS: Full Machine Learning Pipeline Completed!"'

  ml:fetch:
    desc: ML - Downloads raw data and verifies integrity using SHA-256
    cmds:
      - uv run python -m src.data.ingestion

  ml:preprocess:
    desc: ML - Splits train/test sets and applies preprocessing without data leakage
    deps: [ml:fetch]
    cmds:
      - uv run python -m src.features.preprocessing

  ml:train:
    desc: ML - Trains the champion model (XGBoost) and exports it to ONNX format
    deps: [ml:preprocess]
    cmds:
      - uv run python -m src.models.trainer

  ml:clean:
    desc: ML - Wipes all generated datasets, scaled files, and trained models
    silent: true
    ignore_error: true
    cmds:
      - rm -f data/raw/creditcard.csv
      - rm -f data/processed/*.csv
      - rm -f models/*.joblib
      - rm -f models/*.onnx
      - echo "All generated data and models have been wiped clean."

  # ==========================================
  # TESTS
  # ==========================================
  test:all:
    desc: "TEST - Run all test suites sequentially (API, Validator, Consumer)"
    cmds:
      - task: test:api
      - task: test:validator
      - task: test:consumer

  test:api:
    desc: "TEST - Run Go API unit and integration tests"
    dir: src/api
    cmds:
      - go test -v .

  test:consumer:
    desc: "TEST - Run Python ML Consumer unit tests with Pytest"
    env:
      OTEL_SDK_DISABLED: "true"
    cmds:
      - pytest tests/unit/test_consumer.py -v

  test:validator:
    desc: "TEST - Run Rust Validator unit tests via Cargo"
    dir: src/validator/src
    cmds:
      - cargo test

  test:load-health:
    desc: "TEST - Run OHA load test for 1 minute with 250 concurrent workers on health endpoint"
    cmds:
      - oha -c 250 -z 1m http://localhost:8000/

  test:traffic:
    desc: "TEST - Generate random live transaction traffic for Dashboard telemetry simulation"
    cmds:
      - cmd: echo "Installing required dependencies..."
        silent: true
      - pip install -q requests
      - cmd: echo "Starting live traffic generator... Press Ctrl+C to stop."
        silent: true
      - python tests/performance/generate_traffic.py

  # ==========================================
  # SECURITY
  # ==========================================

  # ON
  security:on:
    desc: "SEC - Run all security checks (SAST, Infrastructure, and Rust)"
    deps: [security:sast, security:infra, security:rust]

  # ON TASKS
  security:sast:
    desc: "SEC - Run static application security testing (SAST) and vulnerability checks on Go code"
    dir: src/api
    cmds:
      - gosec ./...
      - govulncheck ./...

  security:infra:
    desc: "SEC - Scan filesystem, IaC (Terraform), and dependencies for vulnerabilities using Trivy"
    cmds:
      - trivy fs .

  security:rust:
    desc: "SEC - Run DevSecOps linter (Clippy) on Rust code"
    dir: src/validator
    cmds:
      - cargo clippy -- -D warnings

  # ==========================================
  # CI/CD
  # ==========================================
  jenkins:on:
    desc: "CI - Start Jenkins container in the background"
    dir: docker/jenkins
    cmds:
      - docker compose up -d

  jenkins:off:
    desc: "CI - Stop and remove Jenkins container"
    dir: docker/jenkins
    cmds:
      - docker compose down
