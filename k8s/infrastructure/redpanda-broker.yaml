apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-redpanda
  labels:
    app: redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
      - name: redpanda
        image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
        args:
        - redpanda
        - start
        - --mode=dev-container
        - --smp=1
        - --memory=1G
        - --reserve-memory=0M
        - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
        - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
        ports:
        - containerPort: 9092
        - containerPort: 19092
        - containerPort: 9644
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1536Mi"
        readinessProbe:
          httpGet:
            path: /v1/status/ready
            port: 9644
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /v1/status/ready
            port: 9644
          initialDelaySeconds: 20
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
spec:
  selector:
    app: redpanda
  ports:
  - name: internal
    protocol: TCP
    port: 9092
    targetPort: 9092
  - name: external
    protocol: TCP
    port: 19092
    targetPort: 19092
  - name: admin
    protocol: TCP
    port: 9644
    targetPort: 9644
