apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-console
  labels:
    app: console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      initContainers:
      - name: wait-for-redpanda
        image: busybox:1.28
        command: ['sh', '-c', "until nc -zv redpanda 9092; do echo waiting for redpanda; sleep 2; done"]
      containers:
      - name: console
        image: docker.redpanda.com/redpandadata/console:v2.4.5
        env:
        - name: KAFKA_BROKERS
          value: "redpanda:9092"
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
          limits:
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: console
spec:
  selector:
    app: console
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
