apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
      - name: wait-for-redis
        image: busybox:1.28
        command: ['sh', '-c', "until nc -zv redis 6379; do echo waiting for redis; sleep 2; done"]
      - name: wait-for-redpanda
        image: busybox:1.28
        command: ['sh', '-c', "until nc -zv redpanda 9092; do echo waiting for redpanda; sleep 2; done"]
      containers:
      - name: api
        image: sentinel-api:v0.5.0
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDPANDA_BROKER
          value: "redpanda:9092"
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
