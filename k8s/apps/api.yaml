apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-api
  labels:
    app: sentinel-api
spec:
  replicas: 3 # 27 milyon isteği göğüsleyecek o mahşerin üç atlısı!
  selector:
    matchLabels:
      app: sentinel-api
  template:
    metadata:
      labels:
        app: sentinel-api
    spec:
      # --- INIT CONTAINERS (Enforces strict startup order) ---
      initContainers:
      - name: wait-for-redis
        image: busybox:1.28
        command: ["sh", "-c", "until nc -zv redis 6379; do echo waiting for redis; sleep 2; done"]
      - name: wait-for-redpanda
        image: busybox:1.28
        command: ["sh", "-c", "until nc -zv redpanda 9092; do echo waiting for redpanda; sleep 2; done"]

      containers:
      - name: api
        image: sentinel-api:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDPANDA_BROKER
          value: "redpanda:9092"
        - name: KAFKA_TOPIC
          value: "transactions"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-api-service
spec:
  type: LoadBalancer
  selector:
    app: sentinel-api
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
