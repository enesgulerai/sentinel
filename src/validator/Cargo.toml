[package]
name = "validator"
version = "0.1.0"
edition = "2021"

[dependencies]
# Kafka Client (TLS/SOCKS5 stripped to eliminate legacy rustls-webpki)
rskafka = { version = "0.5", default-features = false, features = ["compression-snappy", "compression-gzip", "compression-lz4", "compression-zstd"] }

# HTTP Client (Uses modern rustls with patched rustls-webpki >=0.103)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Async Runtime
tokio = { version = "1.39", features = ["full"] }

# Serialization & Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling & Utilities
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
